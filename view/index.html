<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slopproxy traffic</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e4e3df; --text: #1d1d1b; --dim: #6b6a65;
  --hover: #f0efeb; --selected: #e8eefc; --selected-line: #8aa6ef;
  --secret-bg: #fdecc8; --secret-fg: #7a4b00;
  --rename-bg: #dbe7fd; --rename-fg: #1e3f8a;
  --restore-bg: #d7f2df; --restore-fg: #145c2c;
  --ok: #1d7a3e; --bad: #b42318; --wait: #8a6d00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1e1e1c; --line: #33322f; --text: #e9e8e4; --dim: #9a9993;
    --hover: #262624; --selected: #1f2a44; --selected-line: #5d7dd6;
    --secret-bg: #4a3510; --secret-fg: #ffd58a;
    --rename-bg: #1c2f57; --rename-fg: #a9c4ff;
    --restore-bg: #163a24; --restore-fg: #96e3b0;
    --ok: #5cc485; --bad: #ff8a80; --wait: #e2c15a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button[aria-pressed="true"] { background: var(--selected); border-color: var(--selected-line); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: -0.01em; }
.brand span { color: var(--dim); font-weight: 400; }
.status { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.paused .dot { background: var(--wait); }
.status.down .dot { background: var(--bad); }
.spacer { flex: 1; }
label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
main { flex: 1; display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: 0; }
#list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
#detail { overflow-y: auto; padding: 20px 24px 48px; min-width: 0; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 0; padding: 9px 12px 9px 13px; background: transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--selected); border-left-color: var(--selected-line); }
.row .l1 { display: flex; gap: 8px; align-items: baseline; }
.row .id { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 2.5em; }
.row .uri { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.row .time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .l2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; padding-left: calc(2.5em + 8px); font-size: 12px; }
.chip { border-radius: 4px; padding: 0 6px; background: var(--hover); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.wait { color: var(--wait); }
.chip.secret { background: var(--secret-bg); color: var(--secret-fg); }
.chip.restore { background: var(--restore-bg); color: var(--restore-fg); }
.empty { color: var(--dim); padding: 48px 0; text-align: center; }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; font-family: var(--mono); word-break: break-all; }
h2 { font-size: 14px; font-weight: 650; margin: 28px 0 4px; }
h2 + p.hint { margin-top: 0; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: 13px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 4px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 10px; color: var(--dim); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--selected-line); }
.hint { color: var(--dim); font-size: 13px; margin: 6px 0 10px; }
.summary-line { margin: 14px 0 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
code, .code { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
pre { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
mark { border-radius: 3px; padding: 0 2px; }
mark.secret { background: var(--secret-bg); color: var(--secret-fg); }
mark.rename, mark.host { background: var(--rename-bg); color: var(--rename-fg); }
mark.host { text-decoration: underline dotted; }
mark.restore { background: var(--restore-bg); color: var(--restore-fg); }
.hidden-value { color: var(--dim); letter-spacing: 0.1em; }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 6px; font-weight: 600; }
.badge.secret { background: var(--secret-bg); color: var(--secret-fg); }
.badge.rename, .badge.host { background: var(--rename-bg); color: var(--rename-fg); }
.msg { margin: 14px 0; }
.role { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); margin-bottom: 6px; }
.block { margin: 8px 0; }
.block-label { font-size: 12px; color: var(--dim); margin-bottom: 4px; font-family: var(--mono); }
.field { margin: 6px 0; }
.field-key { font-size: 12px; color: var(--dim); font-family: var(--mono); }
details > summary { cursor: pointer; color: var(--dim); font-size: 13px; margin: 8px 0; }
.toolbar { display: flex; gap: 6px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair .col-label { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
.notice { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); margin: 12px 0; }
.notice.bad { border-color: var(--bad); color: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin: 8px 0; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); }
  #detail { padding: 16px; }
  .pair { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand">slopproxy <span>traffic</span></div>
  <div id="status" class="status"><span class="dot"></span><span id="status-text">live</span></div>
  <div class="spacer"></div>
  <label class="toggle" title="Show the real secret values and names instead of dots"><input type="checkbox" id="reveal"> Reveal real values</label>
  <button id="pause" aria-pressed="false">Pause</button>
  <button id="clear">Clear</button>
</header>
<main>
  <nav id="list" aria-label="Requests"></nav>
  <section id="detail"><div class="empty">Waiting for the agent's first request…</div></section>
</main>
<script src="app.js"></script>
</body>
</html>
